<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="options-title">Gemini Spark Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 15px;
            min-width: 320px;
        }
        label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        .label-text {
            line-height: 1.4;
        }
        .description {
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <label>
        <input type="checkbox" id="enter-for-newline">
        <span class="label-text">
            <span id="label-enter">エンターを押したときに改行する</span>
            <div class="description" id="label-enter-desc">
                (チェック時、送信は Ctrl+Enter または Cmd+Enter)
            </div>
        </span>
    </label>
    <script src="js/options.js"></script>
</body>
</html>
